      - Scenarios/ProximitySensor/Scenario1_ProximitySensorDataEvents.xaml.cs
  - id: proximity-sensor-polling
    title: Poll proximity readings
    summary: Request the current proximity reading on demand.
    apis:
      - Windows.Devices.Sensors.ProximitySensor.GetCurrentReading
    sourceFiles:
      - Scenarios/ProximitySensor/Scenario2_ProximitySensorPolling.xaml
      - Scenarios/ProximitySensor/Scenario2_ProximitySensorPolling.xaml.cs
