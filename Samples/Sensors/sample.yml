    sourceFiles:
      - Scenarios/ProximitySensor/Scenario3_ProximitySensorDisplayOnOff.xaml
      - Scenarios/ProximitySensor/Scenario3_ProximitySensorDisplayOnOff.xaml.cs
apis:
  - name: Windows.Devices.Sensors.Accelerometer
    description: Supplies acceleration readings, shake events, reading-type selection, polling, and batching.
    url: https://learn.microsoft.com/uwp/api/windows.devices.sensors.accelerometer
  - name: Windows.Devices.Sensors.Gyrometer
    description: Supplies angular velocity readings through events or polling.
    url: https://learn.microsoft.com/uwp/api/windows.devices.sensors.gyrometer
  - name: Windows.Devices.Sensors.Inclinometer
    description: Supplies absolute or relative pitch, roll, and yaw readings.
    url: https://learn.microsoft.com/uwp/api/windows.devices.sensors.inclinometer
  - name: Windows.Devices.Sensors.OrientationSensor
    description: Supplies absolute or relative quaternion and rotation-matrix readings.
    url: https://learn.microsoft.com/uwp/api/windows.devices.sensors.orientationsensor
  - name: Windows.Devices.Sensors.SimpleOrientationSensor
    description: Reports coarse device orientations such as face up, face down, and rotations.
    url: https://learn.microsoft.com/uwp/api/windows.devices.sensors.simpleorientationsensor
  - name: Windows.Devices.Sensors.Compass
    description: Reports magnetic-north and true-north headings with calibration accuracy.
    url: https://learn.microsoft.com/uwp/api/windows.devices.sensors.compass
  - name: Windows.Devices.Sensors.Magnetometer
    description: Reports magnetic field strength on three axes and calibration accuracy.
    url: https://learn.microsoft.com/uwp/api/windows.devices.sensors.magnetometer
  - name: Windows.Devices.Sensors.Altimeter
    description: Reports altitude changes in meters.
    url: https://learn.microsoft.com/uwp/api/windows.devices.sensors.altimeter
  - name: Windows.Devices.Sensors.Barometer
    description: Reports atmospheric pressure in hectopascals.
    url: https://learn.microsoft.com/uwp/api/windows.devices.sensors.barometer
  - name: Windows.Devices.Sensors.LightSensor
    description: Reports ambient illuminance in lux.
    url: https://learn.microsoft.com/uwp/api/windows.devices.sensors.lightsensor
  - name: Windows.Devices.Sensors.HumanPresenceSensor
    description: Enumerates presence sensors and reports current or changed human presence readings.
    url: https://learn.microsoft.com/uwp/api/windows.devices.sensors.humanpresencesensor
  - name: Windows.Devices.Sensors.ActivitySensor
    description: Reports current, historical, and changed activity readings.
    url: https://learn.microsoft.com/uwp/api/windows.devices.sensors.activitysensor
  - name: Windows.Devices.Sensors.Pedometer
    description: Reports current, historical, and changed step counts and durations.
    url: https://learn.microsoft.com/uwp/api/windows.devices.sensors.pedometer
  - name: Windows.Devices.Sensors.ProximitySensor
    description: Reports nearby-object detection and can provide a display on/off controller.
    url: https://learn.microsoft.com/uwp/api/windows.devices.sensors.proximitysensor
documentation:
  - title: Sensors for Windows apps
    url: https://learn.microsoft.com/windows/uwp/devices-sensors/sensors
    kind: learn
  - title: Accelerometer API reference
    url: https://learn.microsoft.com/uwp/api/windows.devices.sensors.accelerometer
    kind: api-reference
  - title: HumanPresenceSensor API reference
    url: https://learn.microsoft.com/uwp/api/windows.devices.sensors.humanpresencesensor
    kind: api-reference
  - title: ActivitySensor API reference
    url: https://learn.microsoft.com/uwp/api/windows.devices.sensors.activitysensor
    kind: api-reference
requirements:
  minimumWindowsVersion: 10.0.17763.0
  supportedArchitectures:
    - x86
    - x64
    - arm64
  capabilities:
    - name: runFullTrust
      kind: restricted
      description: Allows the packaged WinUI 3 desktop application to run at full trust.
    - name: activity
      kind: device
      description: Allows the activity and pedometer scenarios to request protected activity-related sensor data.
    - name: humanPresence
      kind: device
      description: Allows the presence scenarios to access compatible human presence sensors.
  hardware:
    - Compatible motion or orientation hardware is required for accelerometer, gyrometer, inclinometer, orientation, compass, and magnetometer results.
    - Compatible environmental hardware is required for altitude, pressure, and ambient-light results.
    - Compatible activity, pedometer, human-presence, or proximity hardware is required for those feature groups.
  accountServices: []
  architectureNotes: The manifest minimum is 17763, but HumanPresenceSensor requires build 22621 or later; other sensor availability varies by hardware on all architectures.
featuredFiles:
  - path: SampleConfiguration.cs
    label: Consolidated sensor catalog
    description: Registers all 42 scenarios across 15 motion, orientation, environment, activity, presence, and proximity feature groups.
  - path: Scenarios/Accelerometer/Scenario0_AccelerometerChoose.xaml.cs
    label: Choose acceleration data
    description: Selects a supported accelerometer reading type for the related scenarios.
  - path: Scenarios/Accelerometer/Scenario1_AccelerometerDataEvents.xaml.cs
    label: Sensor event lifecycle
    description: Subscribes to readings and coordinates visibility and dispatcher behavior for live UI updates.
  - path: Scenarios/ActivitySensor/Scenario1_ActivitySensorCurrentActivity.xaml.cs
    label: Protected sensor access
    description: Checks DeviceAccessInformation before requesting a current activity reading.
  - path: Scenarios/Pedometer/Scenario1_PedometerEvents.xaml.cs
    label: Pedometer access and events
    description: Tracks device-access changes and presents step readings as events arrive.
  - path: Scenarios/PresenceSensor/Scenario3_PresenceSensorChoosing.xaml.cs
    label: Choose a presence sensor
    description: Enumerates presence sensor devices and opens the selected sensor by identifier.
screenshots:
  - id: accelerometer-events
    alt: The Sensors app showing live X, Y, and Z accelerometer values beside enable and disable controls.
    scenario: accelerometer-data-events
    capture:
      mode: manual
      readinessSelector: Name=ScenarioEnableButton
      notes: Capture on a device with an available accelerometer after enabling readings; no software or hardware fallback is assumed.
