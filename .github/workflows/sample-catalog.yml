name: Sample catalog

on:
  pull_request:
    paths:
      - ".github/workflows/sample-catalog.yml"
      - "Samples/**"
      - "metadata/**"
      - "templates/sample.yml"
      - "tools/catalog/**"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sample-catalog.yml"
      - "Samples/**"
      - "metadata/**"
      - "templates/sample.yml"
      - "tools/catalog/**"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm catalog:test
      - run: pnpm catalog:validate
      - run: pnpm catalog:generate -- --output "$RUNNER_TEMP/sample-catalog.json"
